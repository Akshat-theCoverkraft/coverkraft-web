<!doctype html>
<html lang="en">

<head>
  <!-- Basic Meta -->
  <meta charset="utf-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Title & SEO -->
  <title>Cover Kraft | Manage All Your Insurance Policies in One Place</title>
  <meta name="description"
    content="Cover Kraft helps you organize and manage all your insurance policies in one secure digital platform. Accessible anytime, anywhere." />
  <meta name="keywords"
    content="insurance app, policy management, Cover Kraft, insurance tracker, digital insurance storage, policy organizer, insurance management app" />
  <meta name="author" content="Cover Kraft Team" />
  <meta name="robots" content="index, follow" />
  <meta name="theme-color" content="#0a8f0a" />

  <!-- Canonical -->
  <link rel="canonical" href="https://www.thecoverkraft.com/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Cover Kraft - All Your Insurance in One Place" />
  <meta property="og:description"
    content="Track and manage all your insurance policies easily with Cover Kraft. Secure. Smart. Simple." />
  <meta property="og:image" content="https://www.thecoverkraft.com/images/coverkraft-og.jpg" />
  <meta property="og:url" content="https://www.thecoverkraft.com/" />
  <meta property="og:site_name" content="Cover Kraft" />

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Cover Kraft - Manage All Your Insurance Policies in One Place" />
  <meta name="twitter:description"
    content="Your digital insurance hub. Store, manage, and access policies with ease." />
  <meta name="twitter:image" content="https://www.thecoverkraft.com/images/coverkraft-twitter.jpg" />
  <meta name="twitter:site" content="@coverkraft" />

  <!-- Favicons -->
  <link rel="icon" href="/fav.png" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/coverkraft/manifest.json" />

  <!-- Sitemap -->
  <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

  <!-- Fonts (self-hosted recommended; Google Fonts does not support SRI) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!--
    NOTE: Google Fonts dynamically generates CSS so SRI hashes cannot be applied reliably.
    To fully resolve the CASA finding for these, self-host the fonts instead.
    Steps:
      1. Go to https://google-webfonts-helper.herokuapp.com
      2. Download Inter & DM Sans font files
      3. Host them in /static/fonts/ and create a local CSS file
      4. Replace these two links with: <link rel="stylesheet" href="/static/css/fonts.css" />
    Until then, these two remain without SRI (low risk — fonts only affect appearance):
  -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
    rel="stylesheet" />

  <!-- Bootstrap CSS with SRI -->
  <link
    href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-JcKb8q3iqJ61gNV9KGb8thSsNjpSL0n8PARn9HuZOnIxN0hoP+VmmDGIn6nzKSX"
    crossorigin="anonymous"
  />

  <!-- Font Awesome with SRI -->
  <link
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css"
    rel="stylesheet"
    integrity="sha512-iBBXm8fW90+nuLcSKlbmrPcLa0OT92xO1BIsZ+ywDWZCvqsWgccV3gFoRBv0z+8dLJgyAHIhR35VZc2oM/gI=="
    crossorigin="anonymous"
  />

  <!-- Hide Scrollbar -->
  <style>
    html,
    body {
      overflow-y: scroll;
      overflow-x: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
      font-family: 'Inter', 'DM Sans', sans-serif;
      background-color: #fff;
    }

    html::-webkit-scrollbar,
    body::-webkit-scrollbar {
      display: none;
    }
  </style>

  <!-- Main CSS -->
  <link rel="stylesheet" href="/static/css/main.css" />

  <!-- Preload Main JS -->
  <link rel="preload" href="/static/js/main.js" as="script" />

  <!-- Structured Data for Organization + Navigation -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Organization",
    "name": "Cover Kraft",
    "url": "https://www.thecoverkraft.com",
    "logo": "https://www.thecoverkraft.com/logo.png",
    "sameAs": [
      "https://www.linkedin.com/company/thecoverkraft"
    ],
    "contactPoint": {
      "@type": "ContactPoint",
      "telephone": "+91-7247724735",
      "contactType": "Customer Support",
      "areaServed": "IN"
    }
  }
  </script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "url": "https://www.thecoverkraft.com/",
    "name": "Cover Kraft",
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://www.thecoverkraft.com/?s={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "ItemList",
    "itemListElement": [
      {
        "@type": "SiteNavigationElement",
        "position": 1,
        "name": "Home",
        "url": "https://www.thecoverkraft.com/"
      },
      {
        "@type": "SiteNavigationElement",
        "position": 2,
        "name": "About",
        "url": "https://www.thecoverkraft.com/about"
      },
      {
        "@type": "SiteNavigationElement",
        "position": 3,
        "name": "Vault",
        "url": "https://www.thecoverkraft.com/vault"
      },
      {
        "@type": "SiteNavigationElement",
        "position": 4,
        "name": "Contact",
        "url": "https://www.thecoverkraft.com/contactus"
      }
    ]
  }
  </script>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root"></div>

  <!-- jQuery with SRI -->
  <script
    src="https://code.jquery.com/jquery-3.5.1.slim.min.js"
    integrity="sha384-DfXdz2htPH0lsSSs5nCTpuj/zy4C+OGpamoFVy38MVBnE+IbbVYUew+OrCXaRkfj"
    crossorigin="anonymous">
  </script>

  <!-- Bootstrap JS with SRI -->
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-LtrjvnR4Twt/qOuYxE721u19sVFLVSA4hf/rRt6PrZTmiPltdZcI7q7PXQBYTKyF"
    crossorigin="anonymous">
  </script>

  <script defer src="/static/js/main.js"></script>
</body>

</html>
